notes: >
  This scenario matters because the cart ERROR logs refer to "redis"
  rather than "valkey-cart" and do not identify the datastore host.
  The logs therefore show that cart cannot reach its datastore, while
  trace evidence is needed to confirm the dependency as valkey-cart:6379.
  Other faults were also active during capture, so future analysis must
  distinguish the causal failure from unrelated concurrent faults.
  For scoring, the answer must identify valkey-cart; "cart's datastore"
  alone is not specific enough.