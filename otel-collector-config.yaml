receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

exporters:
  awsxray:
    region: ap-south-1
  awsemf:
    region: ap-south-1
    namespace: RCACopilot
    log_group_name: /ecs/rca-copilot-metrics
    retain_initial_value_of_delta_metric: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]